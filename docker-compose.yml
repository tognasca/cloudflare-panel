services:
  backend:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_ENV: production
      DATABASE_URL: postgres://cloudflare:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cloudflare_panel
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudflare_panel
      POSTGRES_USER: cloudflare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudflare -d cloudflare_panel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
